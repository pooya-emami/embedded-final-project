<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Embedded Security System - 404300409</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
        h1 { background: #222; color: #fff; padding: 15px; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; }
        .card { background: #fff; padding: 15px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        #stream { border: 3px solid #333; border-radius: 5px; max-width: 640px; background: #111; min-height: 200px; }
        #tele { font-size: 1.1em; }
        .status { font-size: 0.9em; color: #666; }
        .guard-toggle { margin: 10px 0; }
        .guard-toggle button { 
            padding: 10px 20px; 
            font-size: 1em; 
            border: none; 
            border-radius: 5px;
            cursor: pointer;
        }
        .guard-on { background: #4CAF50; color: white; }
        .guard-off { background: #f44336; color: white; }
        .person-count { font-size: 2em; color: #2196F3; }
        .person-count.active { color: #f44336; }
        
        .mode-selector { margin: 10px 0; }
        .mode-selector button {
            padding: 8px 16px;
            margin: 0 5px;
            border: 2px solid #ccc;
            border-radius: 5px;
            background: white;
            cursor: pointer;
            font-size: 0.9em;
        }
        .mode-selector button.active {
            border-color: #2196F3;
            background: #e3f2fd;
            font-weight: bold;
        }
        .mode-selector button:hover {
            background: #f0f0f0;
        }
        .mode-indicator {
            margin: 5px 0;
            font-size: 0.85em;
            color: #666;
            font-weight: bold;
        }
        .mode-hint {
            font-size: 0.8em;
            color: #999;
            margin: 5px 0;
        }
    </style>
</head>
<body>

<h1>Embedded Security System – Pooya Emami (404300409)</h1>

<div class="container">
    <div class="card">
        <h3>Live Stream</h3>
        
        <div class="mode-selector">
            <button id="modeIdle" class="active" onclick="setMode('idle')">⏸ Idle</button>
            <button id="modeRaw" onclick="setMode('raw')">📹 Raw</button>
            <button id="modeProcessed" onclick="setMode('processed')">🎯 Detection</button>
        </div>
        <div class="mode-indicator" id="modeIndicator">Mode: Idle (Stream Off)</div>
        <div class="mode-hint" id="modeHint">No stream - blank screen</div>
        
        <img id="stream" src="/stream?t=0" width="640" alt="Live Stream">
        <div class="status" id="streamStatus">Stream: Idle</div>
    </div>

    <div class="card">
        <h3>Detection Status</h3>
        <div id="personCount" class="person-count">0 persons</div>
        
        <h3>Guard Mode</h3>
        <div class="guard-toggle">
            <button id="guardBtn" class="guard-off" onclick="toggleGuard()">Enable Guard</button>
        </div>
        <div id="guardStatus" style="font-size: 0.9em; color: #666;">Guard: disabled</div>

        <h3>Telemetry</h3>
        <div id="tele">Loading...</div>
    </div>
</div>

<script>
let guardEnabled = false;
let currentMode = 'idle';
let streamInterval = null;

function setMode(mode) {
    currentMode = mode;
    
    // Update button styles
    document.getElementById('modeIdle').className = (mode === 'idle') ? 'active' : '';
    document.getElementById('modeRaw').className = (mode === 'raw') ? 'active' : '';
    document.getElementById('modeProcessed').className = (mode === 'processed') ? 'active' : '';
    
    const modeNames = {
        'idle': 'Idle (Stream Off)',
        'raw': 'Raw Camera Feed',
        'processed': 'Processed (Detection)'
    };
    const modeHints = {
        'idle': 'No stream - blank screen (relay.service stopped)',
        'raw': 'Direct camera feed (relay.service running)',
        'processed': 'Camera with detection overlays (detection.service running)'
    };
    document.getElementById('modeIndicator').textContent = 'Mode: ' + modeNames[mode];
    document.getElementById('modeHint').textContent = modeHints[mode];
    
    // Send mode to server
    fetch('/api/v1/stream_mode', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: mode })
    })
    .then(response => response.json())
    .then(data => {
        console.log('Mode set to:', data.mode);
    })
    .catch(err => {
        console.error('Mode switch error:', err);
    });
    
    // Refresh stream
    const img = document.getElementById('stream');
    img.src = '/stream?t=' + Date.now();
    const status = document.getElementById('streamStatus');
    const modeLabels = {
        'idle': 'Idle (Off)',
        'raw': 'Raw Stream',
        'processed': 'Detection Stream'
    };
    status.textContent = 'Stream: ' + modeLabels[mode];
}

function updateTelemetry() {
    fetch('/api/v1/telemetry')
        .then(response => response.json())
        .then(data => {
            document.getElementById('tele').innerHTML = 
                "CPU Temp: " + (data.temp || 0).toFixed(1) + " C<br>" +
                "Free Memory: " + (data.mem || 0) + " kB<br>" +
                "CPU Load: " + (data.cpu || 0).toFixed(1) + " %";
        })
        .catch(() => {
            document.getElementById('tele').innerHTML = "Error loading telemetry";
        });
}

function updatePersonCount() {
    fetch('/api/v1/persons')
        .then(response => response.json())
        .then(data => {
            const el = document.getElementById('personCount');
            const count = data.count || 0;
            el.textContent = count + " person" + (count !== 1 ? "s" : "");
            el.className = 'person-count' + (count > 0 ? ' active' : '');
        })
        .catch(() => {
            document.getElementById('personCount').textContent = "Error";
        });
}

function toggleGuard() {
    const newState = !guardEnabled;
    fetch('/api/v1/guard', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ enabled: newState })
    })
    .then(response => response.json())
    .then(data => {
        guardEnabled = data.guard_enabled;
        updateGuardUI();
    })
    .catch(err => {
        console.error('Guard toggle error:', err);
    });
}

function updateGuardUI() {
    const btn = document.getElementById('guardBtn');
    const status = document.getElementById('guardStatus');
    if (guardEnabled) {
        btn.textContent = 'Disable Guard';
        btn.className = 'guard-on';
        status.textContent = 'Guard: enabled (alerts active)';
        status.style.color = '#4CAF50';
    } else {
        btn.textContent = 'Enable Guard';
        btn.className = 'guard-off';
        status.textContent = 'Guard: disabled (no alerts)';
        status.style.color = '#f44336';
    }
}

// Refresh stream every 100ms
setInterval(function() {
    const img = document.getElementById('stream');
    img.src = '/stream?t=' + Date.now();
}, 100);

// Start with Idle mode
setMode('idle');

setInterval(updateTelemetry, 2000);
setInterval(updatePersonCount, 3000);

updateTelemetry();
updatePersonCount();
</script>

</body>
</html>
