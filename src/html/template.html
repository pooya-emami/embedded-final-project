<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded Security System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 20px 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #2a2a4a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 600;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .student-id {
            color: #8888aa;
            font-size: 14px;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 20px;
        }
        @media (max-width: 820px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
        .stream-container {
            background: #111122;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #2a2a4a;
            position: relative;
        }
        .stream-container img {
            display: block;
            width: 100%;
            height: auto;
            background: #000;
        }
        .stream-status {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.7);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            backdrop-filter: blur(4px);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff88;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }
        .fps-display {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: rgba(0,0,0,0.7);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-family: monospace;
            color: #88ff88;
            backdrop-filter: blur(4px);
        }
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .card {
            background: #111122;
            border-radius: 12px;
            padding: 18px 20px;
            border: 1px solid #2a2a4a;
        }
        .card h3 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6666aa;
            margin-bottom: 12px;
        }
        .metric {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #1a1a2e;
            font-size: 14px;
        }
        .metric:last-child {
            border-bottom: none;
        }
        .metric .label {
            color: #8888aa;
        }
        .metric .value {
            color: #00ddff;
            font-weight: 500;
            font-family: monospace;
        }
        .metric .value.persons {
            color: #00ff88;
            font-size: 20px;
            font-weight: 700;
        }
        .history-list {
            list-style: none;
            max-height: 120px;
            overflow-y: auto;
        }
        .history-list li {
            padding: 4px 0;
            font-size: 13px;
            color: #aaaacc;
            border-bottom: 1px solid #1a1a2e;
            display: flex;
            justify-content: space-between;
        }
        .history-list li:last-child {
            border-bottom: none;
        }
        .history-list .time {
            color: #666688;
            font-size: 12px;
        }
        .history-list .count {
            color: #00ff88;
        }
        .empty-history {
            color: #444466;
            font-size: 13px;
            text-align: center;
            padding: 10px 0;
        }
        .footer {
            margin-top: 20px;
            text-align: center;
            color: #444466;
            font-size: 12px;
            border-top: 1px solid #1a1a2e;
            padding-top: 15px;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0f;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a4a;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>🔒 Security System</h1>
    <span class="student-id">Student: 404300409</span>
</div>

<div class="container">
    <div class="stream-container">
        <img id="stream" src="/stream" alt="Live Stream">
        <div class="stream-status">
            <span class="status-dot"></span>
            <span>LIVE</span>
        </div>
        <div class="fps-display" id="fpsDisplay">FPS: --</div>
    </div>

    <div class="sidebar">
        <div class="card">
            <h3>👤 Detection</h3>
            <div class="metric">
                <span class="label">Persons Detected</span>
                <span class="value persons" id="persons">0</span>
            </div>
        </div>

        <div class="card">
            <h3>📊 Telemetry</h3>
            <div class="metric">
                <span class="label">🌡️ CPU Temp</span>
                <span class="value" id="temp">--</span>
            </div>
            <div class="metric">
                <span class="label">💾 Free Memory</span>
                <span class="value" id="mem">--</span>
            </div>
            <div class="metric">
                <span class="label">⚡ CPU Load</span>
                <span class="value" id="cpu">--</span>
            </div>
            <div class="metric">
                <span class="label">🕐 Updated</span>
                <span class="value" id="time" style="font-size:12px;color:#666688;">--</span>
            </div>
        </div>

        <div class="card">
            <h3>📜 Recent History</h3>
            <ul class="history-list" id="historyList">
                <li class="empty-history">No detections yet</li>
            </ul>
        </div>
    </div>
</div>

<div class="footer">
    <span>MJPEG Streaming &bull; Auto-reconnect &bull; </span>
    <span id="connectionStatus">Connected</span>
</div>

<script>
// DOM references
const streamImg = document.getElementById('stream');
const personsEl = document.getElementById('persons');
const tempEl = document.getElementById('temp');
const memEl = document.getElementById('mem');
const cpuEl = document.getElementById('cpu');
const timeEl = document.getElementById('time');
const fpsDisplay = document.getElementById('fpsDisplay');
const historyList = document.getElementById('historyList');
const connectionStatus = document.getElementById('connectionStatus');

let fpsCounter = 0;
let fpsTime = Date.now();
let reconnectTimeout = null;

// Update telemetry every 2 seconds
function updateTelemetry() {
    fetch('/telemetry', { cache: 'no-store' })
        .then(res => res.json())
        .then(data => {
            tempEl.textContent = data.temp.toFixed(1) + '°C';
            memEl.textContent = (data.mem / 1024).toFixed(1) + ' MB';
            cpuEl.textContent = data.cpu.toFixed(1) + '%';
            timeEl.textContent = new Date().toLocaleTimeString();
        })
        .catch(() => {
            // Keep showing last values
        });
}

// Update persons and history
function updatePersons() {
    fetch('/api/v1/persons', { cache: 'no-store' })
        .then(res => res.json())
        .then(data => {
            personsEl.textContent = data.count;
        })
        .catch(() => {});
}

function updateHistory() {
    fetch('/api/v1/history', { cache: 'no-store' })
        .then(res => res.json())
        .then(data => {
            if (data.history && data.history.length > 0) {
                historyList.innerHTML = data.history.map(h => 
                    `<li>
                        <span>👤 <span class="count">${h.count}</span> person${h.count > 1 ? 's' : ''}</span>
                        <span class="time">${new Date(h.timestamp * 1000).toLocaleTimeString()}</span>
                    </li>`
                ).join('');
            } else {
                historyList.innerHTML = '<li class="empty-history">No detections yet</li>';
            }
        })
        .catch(() => {});
}

// FPS counter from stream
streamImg.addEventListener('load', function() {
    fpsCounter++;
    const now = Date.now();
    if (now - fpsTime >= 1000) {
        const fps = Math.round(fpsCounter / ((now - fpsTime) / 1000));
        fpsDisplay.textContent = 'FPS: ' + fps;
        fpsCounter = 0;
        fpsTime = now;
    }
    connectionStatus.textContent = 'Connected';
    connectionStatus.style.color = '#00ff88';
});

// Auto-reconnect on stream errors
streamImg.addEventListener('error', function() {
    connectionStatus.textContent = 'Reconnecting...';
    connectionStatus.style.color = '#ff8844';
    clearTimeout(reconnectTimeout);
    reconnectTimeout = setTimeout(() => {
        streamImg.src = '/stream?' + Date.now();
    }, 500);
});

// Force reload on visibility change (for mobile)
document.addEventListener('visibilitychange', function() {
    if (!document.hidden) {
        streamImg.src = '/stream?' + Date.now();
    }
});

// Initial updates
updateTelemetry();
updatePersons();
updateHistory();

// Periodic updates
setInterval(updateTelemetry, 2000);
setInterval(updatePersons, 1500);
setInterval(updateHistory, 5000);

// Periodic stream keepalive (for browsers that cache)
setInterval(() => {
    // Reload stream every 30 seconds to prevent caching issues
    if (!document.hidden) {
        streamImg.src = '/stream?' + Date.now();
    }
}, 30000);

console.log('🔒 Security System UI loaded');
</script>

</body>
</html>
