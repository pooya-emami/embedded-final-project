<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Embedded Security System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1 {
            background: #222;
            color: #fff;
            padding: 10px;
        }
        #tele {
            background: #fff;
            padding: 10px;
            margin-top: 15px;
            border-radius: 5px;
            width: 300px;
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
        }
        img {
            border: 3px solid #333;
            border-radius: 5px;
            max-width: 640px;
        }
    </style>
</head>
<body>

<h1>Embedded Security System – Pooya Emami</h1>

<!-- Live stream: this is a persistent multipart/x-mixed-replace connection.
     The browser keeps ONE connection open and swaps frames as they arrive,
     no polling / no repeated handshakes needed. --> 
<img id="stream" src="/stream" width="480" alt="Live Stream">

<h3>Telemetry</h3>
<div id="tele">Loading...</div>

<script>
// No more manual refresh loop for the stream -- the <img> tag above is
// pointed at the multipart MJPEG endpoint and updates itself as new
// frames arrive over the single open connection.

function updateTelemetry() {
    fetch('/telemetry')
        .then(response => response.json())
        .then(data => {
            document.getElementById('tele').innerHTML =
                "CPU Temp: " + data.temp + " °C<br>" +
                "Free Memory: " + data.mem + " kB<br>" +
                "CPU Load: " + data.cpu + " %";
        })
        .catch(err => {
            document.getElementById('tele').innerHTML = "Error loading telemetry";
        });
}

setInterval(updateTelemetry, 2000);
updateTelemetry();
</script>

</body>
</html>
