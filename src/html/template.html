<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Embedded Security System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1 {
            background: #222;
            color: #fff;
            padding: 10px;
        }
        #tele {
            background: #fff;
            padding: 10px;
            margin-top: 15px;
            border-radius: 5px;
            width: 300px;
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
        }
        img {
            border: 3px solid #333;
            border-radius: 5px;
            max-width: 640px;
        }
    </style>
</head>
<body>

<h1>Embedded Security System – Pooya Emami</h1>

<img id="stream" src="/stream" width="480" alt="Live Stream">

<h3>Telemetry</h3>
<div id="tele">Loading...</div>

<script>
function refreshStream() {
    document.getElementById('stream').src = '/stream?' + Date.now();
}

function updateTelemetry() {
    fetch('/telemetry')
        .then(response => response.json())
        .then(data => {
            document.getElementById('tele').innerHTML =
                "CPU Temp: " + data.temp + " °C<br>" +
                "Free Memory: " + data.mem + " kB<br>" +
                "CPU Load: " + data.cpu + " %";
        })
        .catch(() => {});
}

setInterval(refreshStream, 500);
setInterval(updateTelemetry, 2000);
updateTelemetry();

document.addEventListener('visibilitychange', function() {
    if (!document.hidden) refreshStream();
});
</script>

</body>
</html>
