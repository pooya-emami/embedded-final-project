<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Embedded Security System</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
        h1 { background: #222; color: #fff; padding: 10px; }
        #tele { background: #fff; padding: 10px; margin-top: 15px; border-radius: 5px; width: 300px; }
        img { border: 3px solid #333; border-radius: 5px; display: block; background: #ddd; width: 320px; }
    </style>
</head>
<body>

<h1>Embedded Security System – Pooya Emami</h1>

<img id="stream" src="/stream" width="320" alt="Live Stream">

<h3>Telemetry</h3>
<div id="tele">Loading...</div>

<script>
// Adaptive telemetry - no fixed interval
let interval = 1000;

function updateTelemetry() {
    fetch('/telemetry')
        .then(r => r.json())
        .then(data => {
            document.getElementById('tele').innerHTML =
                "CPU Temp: " + data.temp + " °C<br>" +
                "Free Memory: " + data.mem + " kB<br>" +
                "CPU Load: " + data.cpu + " %";
            interval = Math.max(500, Math.min(10000, interval * (data.cpu > 50 ? 0.7 : 1.3)));
            setTimeout(updateTelemetry, interval);
        })
        .catch(() => {
            interval = Math.min(30000, interval * 2);
            setTimeout(updateTelemetry, interval);
        });
}

// Stream update - simple
function updateStream() {
    document.getElementById('stream').src = '/stream?t=' + Date.now();
}

// Start
updateTelemetry();
setInterval(updateStream, 150);
updateStream();
</script>
</body>
</html>
