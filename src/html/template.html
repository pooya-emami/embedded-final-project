<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Embedded Security System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1 {
            background: #222;
            color: #fff;
            padding: 10px;
        }
        #tele {
            background: #fff;
            padding: 10px;
            margin-top: 15px;
            border-radius: 5px;
            width: 300px;
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
        }
        img {
            border: 3px solid #333;
            border-radius: 5px;
            display: block;
            margin-bottom: 10px;
            /* Add a subtle loading indicator */
            background: #ddd;
        }
        .status {
            font-size: 0.9em;
            color: #666;
            margin: 5px 0;
        }
    </style>
</head>

<body>

<h1>Embedded Security System – Pooya Emami</h1>

<!-- Live stream image -->
<img id="stream" src="/stream" width="480" alt="Live Stream">
<div class="status" id="streamStatus">Stream: Loading...</div>

<h3>Telemetry</h3>
<div id="tele">Loading...</div>

<script>
// Telemetry update
function updateTelemetry() {
    fetch('/telemetry')
        .then(response => response.json())
        .then(data => {
            document.getElementById('tele').innerHTML =
                "CPU Temp: " + data.temp + " °C<br>" +
                "Free Memory: " + data.mem + " kB<br>" +
                "CPU Load: " + data.cpu + " %";
        })
        .catch(err => {
            document.getElementById('tele').innerHTML = "Error loading telemetry";
        });
}

function updateStream() {
    const img = document.getElementById('stream');
    img.src = '/stream?t=' + Date.now(); 

}


setInterval(updateTelemetry, 2000);
updateTelemetry();

setInterval(updateStream, 1);
updateStream(); 
</script>

</body>
</html>
